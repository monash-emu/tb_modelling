[project]
name = "tb_modelling"
description = "Shared TB transmission modelling core and applied studies"
authors = ["Romain Ragonnet <romain.ragonnet@monash.edu>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
lab = "jupyter lab"
test = "pytest tests -v"

# Project modules live in projects/, which is not an installed package; the repo root
# must therefore be importable for `from projects.<name> import ...` to resolve.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

# pytensor compiles C extensions for the pymc sampler. The pinned pymc 5.2.0 ships a
# pytensor that fails to compile against current macOS SDK headers, so the Python fallback
# is used locally. Sampling is slower but correct; Linux (and therefore MASSIVE) compiles
# normally and is unaffected.
[target.osx-arm64.activation.env]
PYTENSOR_FLAGS = "cxx="

[dependencies]
python = "3.10.*"
pymc = "==5.2.0"
ipykernel = ">=7.1.0,<8"
ipython = ">=8.37.0,<9"
jupyter = ">=1.1.1,<2"
openpyxl = ">=3.1.5,<4"
pyarrow = ">=21.0.0,<22"
gitpython = ">=3.1.45,<4"
jinja2 = ">=3.1.6,<4"
pyyaml = ">=6.0.3,<7"
tabulate = ">=0.9.0,<0.10"
seaborn = ">=0.13.2,<0.14"
pypdf = ">=6.16.2,<7"
pytest = ">=8.0,<9"
pip = ">=26.2.1,<27"

[pypi-dependencies]
tbcore = { path = "./core", editable = true }
arviz = ">=0.21.0, <0.22"
estival = { version = "==0.6.0a", extras = ["nevergrad"] }
ipywidgets = ">=8.1.7, <9"
summerepi2 = { git = "https://github.com/monash-emu/summer2gen.git" }
